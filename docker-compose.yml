version: '3'
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    cpu_count: 1
    mem_reservation: 512M
    networks:
      - duckling-network
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 2s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    env_file:
      - ./apps/web/.env
    networks:
      - duckling-network
    ports:
      - '3000:3000'
    depends_on:
      - postgres
    environment:
      DATABASE_URL: 'postgresql://postgres:postgres@postgres:5432/postgres?schema=public'
    command: >
      sh -c "pnpm run prisma:migrate &&
            pnpm run prisma:seed &&
            pnpm start"

networks:
  duckling-network:

volumes:
  postgres_data:
